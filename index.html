
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PaisaPlan - Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <div>
                <h1>PaisaPlan 💰</h1>
                <p>Manage your money smartly</p>
            </div>

            <button id="themeButton" type="button">🌙 Dark Mode</button>
        </header>

        <section class="summary">
            <div class="card">
                <h3>Total Balance</h3>
                <p id="balance">₹0</p>
            </div>

            <div class="card">
                <h3>Total Income</h3>
                <p id="income">₹0</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="expenses">₹0</p>
            </div>
        </section>

        <section class="section">
            <h2>Monthly Budget</h2>

            <div class="budget-form">
                <input
                    type="number"
                    id="budgetInput"
                    placeholder="Enter monthly budget"
                    min="1"
                >

                <button id="budgetButton" type="button">
                    Set Budget
                </button>
            </div>

            <p id="budgetMessage">Set a budget to track your spending.</p>

            <div class="progress-background">
                <div id="budgetProgress"></div>
            </div>
        </section>

        <section class="section">
            <h2 id="formHeading">Add Transaction</h2>

            <form id="transactionForm">

                <label for="title">Transaction Name</label>
                <input
                    type="text"
                    id="title"
                    placeholder="e.g. College fees"
                    required
                >

                <label for="amount">Amount (₹)</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="type">Transaction Type</label>
                <select id="type">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>

                <label for="category">Category</label>
                <select id="category">
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Education">Education</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Salary">Salary</option>
                    <option value="Other">Other</option>
                </select>

                <label for="date">Date</label>
                <input type="date" id="date" required>

                <label for="note">Note (optional)</label>
                <input
                    type="text"
                    id="note"
                    placeholder="Add a short note"
                >

                <button type="submit" id="submitButton">
                    Add Transaction
                </button>

                <button
                    type="button"
                    id="cancelButton"
                    class="secondary-button"
                    hidden
                >
                    Cancel Edit
                </button>

            </form>
        </section>

        <section class="section">
            <h2>Transaction History</h2>

            <div class="filters">
                <input
                    type="text"
                    id="search"
                    placeholder="Search by name or note"
                >

                <select id="typeFilter">
                    <option value="all">All Types</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Education">Education</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Salary">Salary</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <button id="exportButton" type="button">
                Export CSV
            </button>

            <ul id="transactionList"></ul>

            <p id="emptyMessage">No transactions found.</p>
        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
